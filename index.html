<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Organizador Financeiro</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F6F54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root[data-theme="light"]{
  --bg:#F6F5EF; --surface:#FFFFFF; --surface-2:#F0EFE6; --surface-3:#E9E7DA;
  --ink:#161F1A; --ink-soft:#5B6A61; --ink-faint:#8B978F;
  --border:#E1DFD2; --border-strong:#CFCCBB;
  --accent:#1F6F54; --accent-soft:#DCEDE4; --accent-ink:#0E4636;
  --neg:#9C3B2E; --neg-soft:#F3E1DC; --neg-ink:#6E2A1F;
  --warn:#B8842E; --warn-soft:#F4E7D2; --warn-ink:#7A5A1E;
  --blue:#2E5F8A; --blue-soft:#DEE9F2;
  --shadow: 0 1px 2px rgba(20,25,20,0.04), 0 1px 12px rgba(20,25,20,0.04);
}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#151B17; --surface-2:#1B2320; --surface-3:#232C27;
  --ink:#EBEFEA; --ink-soft:#98A69D; --ink-faint:#6C7A72;
  --border:#28322B; --border-strong:#354036;
  --accent:#4FBC96; --accent-soft:#173025; --accent-ink:#8EE0BF;
  --neg:#E28470; --neg-soft:#2E1D18; --neg-ink:#F0A794;
  --warn:#E0B15C; --warn-soft:#2E2410; --warn-ink:#F0CB8C;
  --blue:#7FADD6; --blue-soft:#182530;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 16px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--accent-soft); color:var(--accent-ink);}
h1,h2,h3,h4{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.pos{color:var(--accent);}
.negv{color:var(--neg);}
button{font-family:'Inter',sans-serif; cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}
a{color:inherit;}

#shell{display:flex; min-height:100vh;}

#sidebar{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px 8px;}
.brand-mark{width:30px; height:30px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:15px; flex-shrink:0;}
.brand-text h1{font-size:15px; line-height:1.15;}
.brand-text span{font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}

nav.navlist{display:flex; flex-direction:column; gap:1px; margin-top:6px;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  font-size:13.5px; color:var(--ink-soft); font-weight:500; border:none; background:transparent;
  text-align:left; width:100%; transition:background .12s, color .12s;
}
.navitem:hover{background:var(--surface-2); color:var(--ink);}
.navitem.active{background:var(--accent-soft); color:var(--accent-ink);}
.navitem .ic{width:16px; height:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.nav-sep{height:1px; background:var(--border); margin:12px 6px;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:8px 10px 4px;}

#sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:6px;}
.foot-btn{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--ink-soft); font-weight:500;}
.foot-btn:hover{background:var(--surface-2);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:20;
}
.month-switch{display:flex; align-items:center; gap:10px;}
.month-switch button{width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:15px; display:flex; align-items:center; justify-content:center;}
.month-switch button:hover{background:var(--surface-2);}
.month-label{font-family:'Fraunces',serif; font-size:19px; font-weight:600; min-width:170px; text-align:center; text-transform:capitalize; cursor:pointer; border-radius:6px; padding:2px 8px;}
.month-label:hover{background:var(--surface-2);}
#topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}

#content{padding:26px 28px 60px; max-width:1280px; width:100%; margin:0 auto;}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.page-head h2{font-size:22px;}
.page-head p{margin:4px 0 0; color:var(--ink-soft); font-size:13px;}

.btn{padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-danger{color:var(--neg); border-color:var(--neg-soft);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}

.grid{display:grid; gap:14px;}
.g-cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-5{grid-template-columns:repeat(5,1fr);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow);}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px 16px; position:relative; overflow:hidden; min-width:0;}
.stat-card .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:500; text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stat-card .val{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; overflow-wrap:break-word; line-height:1.2;}
.stat-card .sub{font-size:11.5px; color:var(--ink-faint); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.stat-card.accent-l{border-left:3px solid var(--accent);}
.stat-card.neg-l{border-left:3px solid var(--neg);}
.stat-card.warn-l{border-left:3px solid var(--warn);}
.stat-card.blue-l{border-left:3px solid var(--blue);}

.section-title{font-size:15px; font-weight:600; font-family:'Fraunces',serif; margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}

table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
.table-scroll{width:100%;}
@media(max-width:880px){ .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;} table.datatable{min-width:560px;} }
table.datatable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);}
table.datatable td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
table.datatable tbody tr:hover{background:var(--surface-2);}
table.datatable td.num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; text-align:right;}
table.datatable .rowactions{display:flex; gap:6px; justify-content:flex-end;}
.iconbtn-sm{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.iconbtn-sm:hover{background:var(--surface-3); color:var(--ink);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.badge.ok{background:var(--accent-soft); color:var(--accent-ink);}
.badge.pend{background:var(--warn-soft); color:var(--warn-ink);}
.badge.neg{background:var(--neg-soft); color:var(--neg-ink);}
.badge.info{background:var(--blue-soft); color:var(--blue);}

.progress{height:7px; border-radius:4px; background:var(--surface-3); overflow:hidden; position:relative;}
.progress > div{height:100%; background:var(--accent); border-radius:4px;}
.progress.warn > div{background:var(--warn);}
.progress.over > div{background:var(--neg);}

.empty{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}
.empty .ic{font-size:26px; margin-bottom:8px; opacity:.5;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{padding:9px 4px; margin-right:18px; font-size:13.5px; font-weight:500; color:var(--ink-soft); border-bottom:2px solid transparent; background:none; border-radius:0;}
.tab.active{color:var(--ink); border-bottom-color:var(--accent);}

.modal-overlay{position:fixed; inset:0; background:rgba(15,20,17,0.45); display:flex; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto;}
.modal{background:var(--surface); border-radius:14px; width:100%; max-width:480px; padding:22px 24px 24px; box-shadow:0 20px 50px rgba(0,0,0,0.25); border:1px solid var(--border);}
.modal h3{font-size:17px; margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-size:13.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field-check{display:flex; align-items:center; gap:8px; margin-bottom:13px;}
.field-check input{width:auto;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:9px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.25); opacity:0; transform:translateY(8px); transition:all .25s;}
.toast.show{opacity:1; transform:translateY(0);}

.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
.chart-card h4{font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:12px; font-family:'Inter',sans-serif;}
.chart-wrap{position:relative; height:230px;}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); text-align:center; padding-bottom:4px; font-weight:600;}
.cal-day{min-height:88px; border:1px solid var(--border); border-radius:9px; padding:6px 7px; background:var(--surface); font-size:11px; min-width:0; overflow:hidden;}
.cal-day.empty-day{background:transparent; border:none;}
.cal-day .dnum{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:4px;}
.cal-day.today .dnum{color:var(--accent); font-weight:700;}
.cal-day.today{border-color:var(--accent);}
.cal-evt{display:block; font-size:10px; padding:2px 5px; border-radius:5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cal-evt.rec{background:var(--accent-soft); color:var(--accent-ink);}
.cal-evt.desp{background:var(--neg-soft); color:var(--neg-ink);}
.cal-evt.card{background:var(--blue-soft); color:var(--blue);}
.cal-evt.div{background:var(--warn-soft); color:var(--warn-ink);}

.meta-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:17px 18px;}
.meta-card .mh{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.meta-card h4{font-size:15px;}
.meta-card .prazo{font-size:11px; color:var(--ink-faint);}
.meta-nums{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; font-family:'IBM Plex Mono',monospace;}

.dividas-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px;}

.kv-list{display:flex; flex-direction:column; gap:9px;}
.kv-row{display:flex; justify-content:space-between; font-size:13px; padding-bottom:9px; border-bottom:1px solid var(--border);}
.kv-row:last-child{border:none; padding-bottom:0;}
.kv-row .k{color:var(--ink-soft);}
.kv-row .v{font-family:'IBM Plex Mono',monospace; font-weight:600;}

.alert-box{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:9px; font-size:12.5px; margin-bottom:8px;}
.alert-box.warn{background:var(--warn-soft); color:var(--warn-ink);}
.alert-box.neg{background:var(--neg-soft); color:var(--neg-ink);}
.alert-box.pos{background:var(--accent-soft); color:var(--accent-ink);}

.filters-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.filters-row select, .filters-row input{padding:7px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--ink);}

.narrative{font-size:13.5px; line-height:1.7; color:var(--ink); background:var(--surface-2); border-radius:10px; padding:16px 18px;}
.narrative ul{margin:8px 0 0; padding-left:18px;}
.narrative li{margin-bottom:5px;}

.linkmore{background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; padding:0; cursor:pointer; white-space:nowrap;}
.linkmore:hover{text-decoration:underline;}
.dash-section{margin-bottom:28px;}
.dash-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.dash-section-head h3{font-size:15px; font-family:'Fraunces',serif; font-weight:600;}
.mini-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; min-width:0; cursor:pointer; transition:border-color .12s;}
.mini-card:hover{border-color:var(--border-strong);}
.mini-card .mc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.mini-card .mc-name{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-card .mc-val{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; margin-top:6px; overflow-wrap:break-word;}
.mini-card .mc-sub{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.dash-hero{display:grid; grid-template-columns:1.15fr 2fr; gap:14px; align-items:stretch;}
.hero-result{border-radius:12px; padding:22px 24px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden; border:1px solid var(--border);}
.hero-result.pos{background:var(--accent-soft);}
.hero-result.neg{background:var(--neg-soft);}
.hero-result .lbl{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;}
.hero-result.pos .lbl{color:var(--accent-ink);}
.hero-result.neg .lbl{color:var(--neg-ink);}
.hero-result .val{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:700; letter-spacing:-0.01em; line-height:1.05; overflow-wrap:break-word;}
.hero-result.pos .val{color:var(--accent-ink);}
.hero-result.neg .val{color:var(--neg-ink);}
.hero-result .sub{font-size:12px; margin-top:8px; opacity:.75;}
.hero-result.pos .sub{color:var(--accent-ink);}
.hero-result.neg .sub{color:var(--neg-ink);}
.hero-sub-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(max-width:880px){ .dash-hero{grid-template-columns:1fr;} }
.patrimonio-share-bar{display:flex; height:9px; border-radius:5px; overflow:hidden; margin-bottom:14px; background:var(--surface-3);}
.psb-seg{height:100%; transition:width .3s;}
.psb-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; font-size:11.5px; color:var(--ink-soft);}
.psb-legend span.dot{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px;}
.patrimonio-bar{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden;}
.cat-more-row{display:flex; align-items:center; gap:8px; font-size:12px; padding:6px 0 0; color:var(--ink-faint); border-top:1px dashed var(--border); margin-top:4px;}
.patrimonio-bar > div{padding:15px 16px; min-width:0; border-right:1px solid var(--border);}
.patrimonio-bar > div:last-child{border-right:none;}
.patrimonio-bar .pb-label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}
.patrimonio-bar .pb-val{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; overflow-wrap:break-word;}
.patrimonio-bar .pb-row{display:flex; justify-content:space-between; font-size:12px; margin-top:5px; gap:6px;}
.patrimonio-bar .pb-row span:last-child{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
@media(max-width:880px){ .patrimonio-bar{grid-template-columns:1fr 1fr;} }
@media(max-width:480px){ .patrimonio-bar{grid-template-columns:1fr;} .patrimonio-bar>div{border-right:none; border-bottom:1px solid var(--border);} .patrimonio-bar>div:last-child{border-bottom:none;} }
.lanc-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.lanc-row:last-child{border-bottom:none;}
.lanc-date{font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); font-size:11.5px; min-width:34px;}
.lanc-desc{flex:1; min-width:0;}
.lanc-desc .d1{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lanc-desc .d2{font-size:11px; color:var(--ink-faint);}
.lanc-val{font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap;}

@media(max-width:1180px){
  .g-5{grid-template-columns:repeat(3,1fr);}
  .g-4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:880px){
  #sidebar{position:fixed; left:-236px; z-index:50; transition:left .2s; box-shadow:0 0 0 9999px rgba(0,0,0,0); height:100vh;}
  #sidebar.open{left:0; box-shadow:0 0 0 9999px rgba(0,0,0,0.4);}
  #sidebar-toggle{display:flex !important;}
  #content{padding:18px 14px 50px;}
  #topbar{padding:12px 14px;}
  .g-2, .g-3{grid-template-columns:1fr;}
  .g-5{grid-template-columns:repeat(2,1fr);}
  .g-4{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .month-label{min-width:auto; font-size:16px;}
}
@media(max-width:480px){
  .g-5{grid-template-columns:1fr;}

  /* ===== Modo compacto iPhone ===== */
  html{ -webkit-text-size-adjust:100%; }
  #content{ padding:12px 10px 40px; }
  #topbar{ padding:8px 10px; gap:8px; }
  #topbar > div:first-child{ gap:8px; }
  .month-switch{ gap:4px; }
  .month-switch button{ width:26px; height:26px; font-size:13px; border-radius:6px; }
  .month-label{ font-size:14px; min-width:0; padding:2px 4px; }
  #save-status{ display:none; }
  .btn#quick-add span, #quick-add span, #quick-text span{ display:none; }

const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
const addMonths = (mk,n) => { let [y,m]=mk.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return monthKey(y,m); };
const monthLabel = mk => { const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };

const daysInMonth = mk => { const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); };

/* ===================== PERSISTÊNCIA ===================== */
/* Usa window.storage quando disponível (ambiente Claude). Fora dele (ex.: arquivo
   aberto direto no Chrome), usa localStorage do navegador como alternativa. */
const STORAGE_KEY = 'organizador-financeiro-state';
const hasClaudeStorage = () => (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function loadState(){
  if(hasClaudeStorage()){
    try{
      const r = await window.storage.get(STORAGE_KEY);
      if(r && r.value) return JSON.parse(r.value);
      return null;
    }catch(e){ /* chave ainda não existe -> segue para localStorage */ }
  }
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('Não foi possível ler dados salvos', e); return null; }
}
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 350);
}
async function saveState(){
  window.__saveStatus = 'saving'; updateSaveStatus();
  const payload = JSON.stringify(state);
  if(hasClaudeStorage()){
    try{
      await window.storage.set(STORAGE_KEY, payload);
      window.__saveStatus = 'ok'; window.__lastSavedAt = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); updateSaveStatus();
      return;
    }
    catch(e){ console.error('Falha ao salvar (window.storage), tentando localStorage', e); }
  }
  try{
    window.localStorage.setItem(STORAGE_KEY, payload);
    window.__saveStatus = 'ok'; window.__lastSavedAt = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); updateSaveStatus();
  }
  catch(e){
    console.error('Falha ao salvar no navegador', e);
    window.__saveStatus = 'error'; updateSaveStatus();
    toast('Não foi possível salvar as alterações neste navegador');
  }
}
function mutate(fn){
  fn();
  scheduleSave();
}

function mesFaturaParaCompra(cartao, dataCompraISO){
  const [y,m,d] = dataCompraISO.split('-').map(Number);
  let mk = monthKey(y,m);
  if(d >= cartao.fechamento) mk = addMonths(mk,1);
  return mk;
}
function faturaCartaoNoMes(cartao, mk){
  let total = 0;
  (cartao.compras||[]).forEach(c=>{
    const parcelaValor = c.valorTotal / c.parcelas;
    for(let p=0;p<c.parcelas;p++){
      if(addMonths(c.mesInicio,p) === mk) total += parcelaValor;
    }
  });
  return total;
}
function faturaPagaNoMes(cartao, mk){
  const f = (cartao.faturasPagas||[]).find(x=>x.mes===mk);
  return f ? f.valor : 0;
}
function faturaFoiPaga(cartao, mk){
  return !!(cartao.faturasPagas||[]).find(x=>x.mes===mk);
}
function totalFaturasPagasNoMes(mk){
  return state.cartoes.reduce((s,c)=> s + faturaPagaNoMes(c,mk), 0);
}
function totalFaturasCartoesNoMes(mk){
  return state.cartoes.reduce((s,c)=> s + faturaCartaoNoMes(c,mk), 0);
}
function limiteUsadoCartao(cta){
  if(cta.limiteUsadoManual!=null && cta.limiteUsadoManual!=='') return Number(cta.limiteUsadoManual);
  let usado = 0;
  (cta.compras||[]).forEach(c=>{
    const parcelaValor = c.valorTotal/c.parcelas;
    for(let p=0;p<c.parcelas;p++){
      const mk = addMonths(c.mesInicio,p);
      if(!faturaFoiPaga(cta, mk)) usado += parcelaValor;
    }
  });
  return usado;
}
function receitasDoMes(mk){ return (state.meses[mk]&&state.meses[mk].receitas)||[]; }
function despesasDoMes(mk){ return (state.meses[mk]&&state.meses[mk].despesas)||[]; }
function limparSerieRecorrente(recorrenteId, exceptoId){
  Object.values(state.meses).forEach(m=>{
    if(!m.despesas) return;
    m.despesas = m.despesas.filter(d => !(d.recorrenteId===recorrenteId && d.id!==exceptoId));
  });
}
function gerarSerieRecorrente(base, mkBase, ateMes){
  const dia = base.data.slice(8,10);
  let mk = addMonths(mkBase,1);
  let guard = 0;
  while(mk <= ateMes && guard < 240){
    const mesObj = ensureMonth(mk);
    const dim = daysInMonth(mk);
    const diaAjustado = String(Math.min(Number(dia), dim)).padStart(2,'0');
    mesObj.despesas.push({
      id: uid(), tipo: base.tipo, descricao: base.descricao, categoria: base.categoria, valor: base.valor,
      data: mk+'-'+diaAjustado, formaPagamento: base.formaPagamento, contaOuCartao: base.contaOuCartao,
      recorrente: true, recorrenteId: base.recorrenteId, recorrenteAte: base.recorrenteAte, status: 'pendente',
    });
    mk = addMonths(mk,1);
    guard++;
  }
}
function limparSerieReceitaRecarga(recargaRecorrenteId){
  Object.values(state.meses).forEach(m=>{
    if(!m.receitas) return;
    m.receitas = m.receitas.filter(r => r.recargaRecorrenteId !== recargaRecorrenteId);
  });
}
function gerarSerieReceitaRecarga(conta, mkBase){
  limparSerieReceitaRecarga(conta.recargaRecorrenteId);
  const ateMes = addMonths(mkBase, 18);
  let mk = mkBase;
  let guard = 0;
  while(mk <= ateMes && guard < 240){
    const mesObj = ensureMonth(mk);
    const dim = daysInMonth(mk);
    const dia = String(Math.min(conta.recargaDia||5, dim)).padStart(2,'0');
    mesObj.receitas.push({
      id: uid(), descricao: `Recarga — ${conta.banco}`, categoria: 'Vale alimentação', valor: conta.recargaMensal,
      dataPrevista: mk+'-'+dia, dataRecebimento: null, conta: conta.id, status: 'previsto',
      recorrente: true, recargaRecorrenteId: conta.recargaRecorrenteId,
    });
    mk = addMonths(mk,1);
    guard++;
  }
}

function totalReceitasRecebidas(mk){ return receitasDoMes(mk).filter(r=>r.status==='recebido').reduce((s,r)=>s+Number(r.valor),0); }
function totalReceitasPrevistas(mk){ return receitasDoMes(mk).reduce((s,r)=>s+Number(r.valor),0); }
function totalDespesasPagas(mk,tipo){ return despesasDoMes(mk).filter(d=>d.status==='pago' && (!tipo||d.tipo===tipo)).reduce((s,d)=>s+Number(d.valor),0); }
function totalDespesasPrevistas(mk,tipo){ return despesasDoMes(mk).filter(d=>!tipo||d.tipo===tipo).reduce((s,d)=>s+Number(d.valor),0); }
function totalDividasPagas(mk){ return ((state.meses[mk]&&state.meses[mk].pagamentosDividas)||[]).reduce((s,p)=>s+Number(p.valor),0); }
function totalInvestido(mk){ return ((state.meses[mk]&&state.meses[mk].investimentos)||[]).reduce((s,i)=>s+Number(i.valor),0); }

function saldoInicialDoMes(mk){
  const m = state.meses[mk];
  if(m && m.saldoInicial!=null) return m.saldoInicial;
  const prev = addMonths(mk,-1);
  if(state.meses[prev]) return calcSaldoFinal(prev);
  return 0;
}
function calcSaldoFinal(mk){
  const inicial = saldoInicialDoMes(mk);
  const rec = totalReceitasRecebidas(mk);
  const desp = totalDespesasPagas(mk);
  const fat = totalFaturasPagasNoMes(mk);
  const div = totalDividasPagas(mk);
  const inv = totalInvestido(mk);
  return inicial + rec - desp - fat - div - inv;
}
function monthMetrics(mk){
  const saldoInicial = saldoInicialDoMes(mk);
  const totalReceitas = totalReceitasRecebidas(mk);
  const despFixas = totalDespesasPagas(mk,'fixa');
  const despVar = totalDespesasPagas(mk,'variavel');
  const totalDespesas = despFixas + despVar;
  const faturas = totalFaturasPagasNoMes(mk);
  const dividas = totalDividasPagas(mk);
  const investido = totalInvestido(mk);
  const saldoDisponivel = saldoInicial + totalReceitas - totalDespesas - faturas - dividas - investido;
  const comprometida = totalReceitas>0 ? ((totalDespesas+faturas+dividas)/totalReceitas*100) : 0;
  const economia = totalReceitas>0 ? ((totalReceitas-totalDespesas-faturas-dividas)/totalReceitas*100) : 0;
  return {saldoInicial,totalReceitas,despFixas,despVar,totalDespesas,faturas,dividas,investido,saldoDisponivel,comprometida,economia};
}
function patrimonioTotal(){
  const contas = state.contas.reduce((s,c)=>s+Number(c.saldoAtual),0);
  const metas = state.metas.reduce((s,m)=>s+Number(m.valorAcumulado),0);
  const carteira = (state.investimentosCarteira||[]).reduce((s,i)=>s+Number(i.valorAtual),0);
  return contas + metas + carteira;
}

      for(let p=0;p<c.parcelas;p++){
        if(addMonths(c.mesInicio,p)===mk) map[c.categoria] = (map[c.categoria]||0) + parcelaValor;

function ultimosLancamentos(mk, n){
  const items = [];
  receitasDoMes(mk).filter(r=>r.status==='recebido').forEach(r=>{
    items.push({data:r.dataRecebimento||r.dataPrevista, descricao:r.descricao, categoria:r.categoria, contaLabel:contaLabel(r.conta), valor:Number(r.valor)});
  });
  despesasDoMes(mk).filter(d=>d.status==='pago' && d.formaPagamento!=='Cartão de crédito').forEach(d=>{
    items.push({data:d.data, descricao:d.descricao, categoria:d.categoria, contaLabel:contaLabel(d.contaOuCartao), valor:-Number(d.valor)});
  });
  state.cartoes.forEach(cta=>{
    (cta.compras||[]).forEach(c=>{
      if((c.dataCompra||'').startsWith(mk)){
        items.push({data:c.dataCompra, descricao:c.descricao, categoria:c.categoria, contaLabel:cta.nome, valor:-(c.valorTotal/c.parcelas)});
      }
    });
  });
  return items.filter(i=>i.data).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,n||5);
}

function parseLancamentoRapido(texto){

  let valor = 0, descricao = raw;
  if(matchValor){
    const numStr = matchValor[0].replace(/\.(?=\d{3})/g,'').replace(',','.');
    valor = parseFloat(numStr) || 0;
    descricao = (raw.slice(0, matchValor.index) + ' ' + raw.slice(matchValor.index + matchValor[0].length))
      .replace(/r\$/ig,'').replace(/\s+/g,' ').trim();
  }
  if(!descricao) descricao = raw;
  const textoLower = raw.toLowerCase();
  const ehReceita = PALAVRAS_RECEITA.some(p=>textoLower.includes(p));
  let categoria = 'Outros';
  for(const [palavras, cat] of MAPA_CATEGORIAS){
    if(palavras.some(p=>textoLower.includes(p))){ categoria = cat; break; }
  }
  descricao = descricao.charAt(0).toUpperCase() + descricao.slice(1);
  return { valor, descricao: descricao||'Lançamento', categoria, ehReceita };
}

function openModal({title, bodyHtml, onSubmit, submitLabel='Salvar', hideFooter=false, wide=false}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" style="${wide?'max-width:600px;':''}">
        <h3>${title}</h3>
        <form id="modal-form">
          ${bodyHtml}
          ${hideFooter?'':`<div class="modal-actions">
            <button type="button" class="btn" id="modal-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary">${submitLabel}</button>
          </div>`}
        </form>
      </div>
    </div>`;
  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  const cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
  const form = document.getElementById('modal-form');
  if(onSubmit){
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      try{ onSubmit(new FormData(form), form); }
      catch(err){ console.error('Erro ao salvar', err); toast('Não foi possível salvar — tente novamente'); }
    });
  }
  return form;
}

function buildAlerts(mk){
  const alerts = [];
  const m = monthMetrics(mk);
  const plan = state.meses[mk]?.planejamento;
  if(plan && plan.limiteGastos>0 && m.totalDespesas > plan.limiteGastos){
    alerts.push({type:'neg', text:`${ic('trash',13)} As despesas do mês (${fmtBRL(m.totalDespesas)}) já ultrapassaram o limite planejado de ${fmtBRL(plan.limiteGastos)}.`});
  } else if(plan && plan.limiteGastos>0 && m.totalDespesas > plan.limiteGastos*0.85){
    alerts.push({type:'warn', text:`As despesas do mês estão em ${fmtPct(m.totalDespesas/plan.limiteGastos*100)} do limite planejado.`});
  }
  if(plan && plan.orcamento){
    const spend = categoriaSpendNoMes(mk);
    Object.entries(plan.orcamento).forEach(([cat,budget])=>{
      if(!budget) return;
      const gasto = spend[cat]||0;
      if(gasto > budget) alerts.push({type:'neg', text:`Categoria <b>${escapeHtml(cat)}</b> ultrapassou o orçamento: ${fmtBRL(gasto)} de ${fmtBRL(budget)} planejados.`});
      else if(gasto > budget*0.9) alerts.push({type:'warn', text:`Categoria <b>${escapeHtml(cat)}</b> está próxima do limite: ${fmtBRL(gasto)} de ${fmtBRL(budget)}.`});
    });
  }
  state.cartoes.forEach(cta=>{
    if(!faturaFoiPaga(cta,mk)){
      const fat = faturaCartaoNoMes(cta,mk);
      if(fat>0){
        const diaVenc = cta.vencimento;
        const hoje = new Date();
        const isCurrentRealMonth = mk === monthKey(hoje.getFullYear(), hoje.getMonth()+1);
        if(isCurrentRealMonth && hoje.getDate() > diaVenc-5){
          alerts.push({type:'warn', text:`Fatura do cartão <b>${escapeHtml(cta.nome)}</b> vence dia ${diaVenc} — valor previsto ${fmtBRL(fat)}.`});
        }
      }
    }
  });
  const resultadoMesAlerta = resultadoDoMes(mk);
  if(resultadoMesAlerta<0) alerts.push({type:'warn', text:`O resultado do mês está negativo: ${fmtBRL(resultadoMesAlerta)} (receitas menos despesas e faturas).`});
  if(saldoDisponivelContas()<0) alerts.push({type:'neg', text:`O saldo disponível nas contas está negativo: ${fmtBRL(saldoDisponivelContas())}.`});
  return alerts;
}
function metaCardHtml(meta){
  const pct = clamp(meta.valorAcumulado/meta.valorObjetivo*100,0,100);

  return `<div class="meta-card">

    <div class="meta-nums"><span>${fmtBRL(meta.valorAcumulado)}</span><span style="color:var(--ink-faint)">${fmtBRL(meta.valorObjetivo)}</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--ink-soft);">

function renderUpcomingTable(mk){
  const events = collectMonthEvents(mk).filter(e=>!e.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  if(!events.length) return `<div class="empty">${ic('check',24)}<div>Nenhuma pendência para este mês.</div></div>`;
  return `<div class="table-scroll"><table class="datatable"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th style="text-align:right">Valor</th></tr></thead><tbody>
    ${events.map(e=>`<tr><td class="mono">${fmtDate(e.date)}</td><td>${escapeHtml(e.desc)}</td><td><span class="badge ${e.badge}">${e.tag}</span></td><td class="num">${fmtBRL(e.valor)}</td></tr>`).join('')}
  </tbody></table></div>`;

function collectMonthEvents(mk){
  const events = [];
  receitasDoMes(mk).forEach(r=>{ events.push({date:r.dataPrevista, desc:r.descricao, valor:r.valor, tag:'Receita', badge:'ok', done:r.status==='recebido'}); });
  despesasDoMes(mk).forEach(d=>{ events.push({date:d.data, desc:d.descricao, valor:d.valor, tag: d.tipo==='fixa'?'Despesa fixa':'Despesa variável', badge:'neg', done:d.status==='pago'}); });
  state.cartoes.forEach(cta=>{
    const fat = faturaCartaoNoMes(cta,mk);
    if(fat>0){
      const dueDate = `${mk}-${String(cta.vencimento).padStart(2,'0')}`;
      events.push({date:dueDate, desc:`Fatura ${cta.nome}`, valor:fat, tag:'Cartão', badge:'info', done:faturaFoiPaga(cta,mk)});
    }
  });
  state.dividas.forEach(dv=>{
    if(dv.proxVencimento && dv.proxVencimento.startsWith(mk)){
      const paid = (state.meses[mk]?.pagamentosDividas||[]).some(p=>p.dividaId===dv.id);
      events.push({date:dv.proxVencimento, desc:dv.nome, valor:dv.valorParcela, tag:'Dívida', badge:'pend', done:paid});
    }
  });
  return events;
}

function renderCartoes(c){

function cartaoBlockHtml(cta, mk){
  const limiteUsado = limiteUsadoCartao(cta);
  const limiteDisp = Math.max(0, cta.limiteTotal - limiteUsado);
  const pctUso = clamp(limiteUsado/cta.limiteTotal*100,0,100);
  const faturaAtual = faturaCartaoNoMes(cta, mk);
  const pago = faturaFoiPaga(cta, mk);
  const todasCompras = (cta.compras||[]).slice().sort((a,b)=>(b.dataCompra||'').localeCompare(a.dataCompra||''));
  const compraAtiva = cp => addMonths(cp.mesInicio, cp.parcelas-1) >= mk;
  const verHistorico = cartoesHistoricoAberto.has(cta.id);

    </div>

    ${compras.length ? `<div class="table-scroll"><table class="datatable" style="margin-top:10px;"><thead><tr>
      <th>Compra</th><th>Categoria</th><th>Data</th><th>Parcelas</th><th style="text-align:right">Valor total</th><th></th>

        </div></td>
      </tr>`).join('')}
    </tbody></table></div>
    ${ocultas>0 || verHistorico ? `<button class="btn btn-sm" style="margin-top:10px;" data-cartao-act="toggle-historico" data-cid="${cta.id}">
        ${verHistorico ? 'Ocultar compras já encerradas' : `Ver histórico completo (+${ocultas} encerrada${ocultas>1?'s':''})`}
      </button>` : ''}

/* ===================== CALENDÁRIO ===================== */
function renderCalendario(c){
  const mk = CURRENT_MONTH;
  const events = collectMonthEvents(mk);
  const byDay = {};
  events.forEach(e=>{ if(!e.date) return; const d = Number(e.date.slice(8,10)); (byDay[d]=byDay[d]||[]).push(e); });
  const [y,mo] = mk.split('-').map(Number);
  const firstDow = new Date(y,mo-1,1).getDay();
  const total = daysInMonth(mk);
  const todayStr = todayISO();
  const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty-day"></div>`;
  for(let d=1; d<=total; d++){
    const dateStr = `${mk}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const evts = (byDay[d]||[]).slice(0,3);
    const extra = (byDay[d]||[]).length - evts.length;
    cells += `<div class="cal-day ${isToday?'today':''}">
      <div class="dnum">${d}</div>
      ${evts.map(e=>`<span class="cal-evt ${e.tag==='Receita'?'rec':e.tag==='Cartão'?'card':e.tag==='Dívida'?'div':'desp'}" title="${escapeHtml(e.desc)} — ${fmtBRL(e.valor)}">${escapeHtml(e.desc)}</span>`).join('')}
      ${extra>0?`<span style="font-size:9.5px;color:var(--ink-faint);">+${extra}</span>`:''}
    </div>`;
  }
  const vencidas = events.filter(e=>!e.done && e.date && e.date < todayStr && mk <= todayStr.slice(0,7));
  c.innerHTML = `
    <div class="page-head"><div><h2>Calendário financeiro</h2><p>Entradas, contas a pagar, cartões e parcelas de ${monthLabel(mk)}</p></div></div>
    ${vencidas.length ? `<div class="alert-box neg" style="margin-bottom:14px;">${vencidas.length} pendência(s) vencida(s) neste mês.</div>` : ''}
    <div style="display:flex;gap:16px;margin-bottom:14px;font-size:12px;color:var(--ink-soft);">
      <span><span class="cal-evt rec" style="padding:2px 8px;">■</span> Receita</span>
      <span><span class="cal-evt desp" style="padding:2px 8px;">■</span> Despesa</span>
      <span><span class="cal-evt card" style="padding:2px 8px;">■</span> Cartão</span>
      <span><span class="cal-evt div" style="padding:2px 8px;">■</span> Dívida</span>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

/* ===================== FECHAMENTO MENSAL ===================== */
function renderFechamento(c){
  const mk = CURRENT_MONTH;
  ensureMonth(mk);
  const m = monthMetrics(mk);
  const mesData = state.meses[mk];
  const prevMk = addMonths(mk,-1);
  const prevM = state.meses[prevMk] ? monthMetrics(prevMk) : null;
  const spend = categoriaSpendNoMes(mk);
  const spendPrev = state.meses[prevMk] ? categoriaSpendNoMes(prevMk) : {};
  const topCats = Object.entries(spend).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const increased = Object.entries(spend).filter(([cat,v])=>spendPrev[cat] && v > spendPrev[cat]*1.1)
    .map(([cat,v])=>`${cat} (+${fmtPct((v/spendPrev[cat]-1)*100)})`);
  const nextMk = addMonths(mk,1);
  const nextEvents = collectMonthEvents(nextMk).filter(e=>!e.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);

  c.innerHTML = `
    <div class="page-head">
      <div><h2>Fechamento mensal</h2><p>Resumo consolidado de ${monthLabel(mk)}</p></div>
      ${!mesData.fechado ? `<button class="btn btn-primary" id="fechar-mes">${ic('check',15)}Fechar mês</button>` : `<span class="badge ok" style="font-size:12px;padding:6px 12px;">mês fechado</span>`}
    </div>
    <div class="grid g-cards" style="margin-bottom:22px;">
      <div class="stat-card"><span class="lbl">Receita total</span><span class="val mono pos">${fmtBRL(m.totalReceitas)}</span></div>
      <div class="stat-card"><span class="lbl">Despesas totais</span><span class="val mono negv">${fmtBRL(m.totalDespesas)}</span></div>
      <div class="stat-card"><span class="lbl">Cartões</span><span class="val mono">${fmtBRL(m.faturas)}</span></div>
      <div class="stat-card"><span class="lbl">Dívidas</span><span class="val mono">${fmtBRL(m.dividas)}</span></div>
      <div class="stat-card"><span class="lbl">Investimentos</span><span class="val mono">${fmtBRL(m.investido)}</span></div>
      <div class="stat-card accent-l" style="grid-column:span 2;"><span class="lbl">Saldo final do mês</span><span class="val mono" style="font-size:24px;color:${m.saldoDisponivel>=0?'var(--accent)':'var(--neg)'}">${fmtBRL(m.saldoDisponivel)}</span><span class="sub">torna-se o saldo inicial de ${monthLabel(nextMk)}</span></div>
    </div>

    <div class="section-title">Análise automática</div>
    <div class="narrative">
      <ul>
        ${topCats.length ? `<li>Onde mais gastou: <b>${escapeHtml(topCats[0][0])}</b> (${fmtBRL(topCats[0][1])})${topCats[1]?`, seguido de ${escapeHtml(topCats[1][0])} (${fmtBRL(topCats[1][1])})`:''}.</li>` : '<li>Nenhuma despesa registrada para identificar as principais categorias.</li>'}
        ${increased.length ? `<li>Categorias que aumentaram em relação ao mês anterior: ${increased.map(escapeHtml).join(', ')}.</li>` : (prevM ? '<li>Nenhuma categoria teve aumento relevante em relação ao mês anterior.</li>' : '')}
        <li>Economia do mês: <b>${fmtBRL(Math.max(0,m.totalReceitas-m.totalDespesas-m.faturas-m.dividas))}</b> (${fmtPct(m.economia)} da renda).</li>
        <li>Total investido no mês: <b>${fmtBRL(m.investido)}</b>.</li>
        ${prevM ? `<li>Evolução em relação ao mês anterior: saldo final passou de ${fmtBRL(prevM.saldoDisponivel)} para ${fmtBRL(m.saldoDisponivel)} (${m.saldoDisponivel>=prevM.saldoDisponivel?'crescimento':'queda'} de ${fmtBRL(Math.abs(m.saldoDisponivel-prevM.saldoDisponivel))}).</li>` : ''}
        <li>Gastos que podem ser reduzidos: categorias variáveis acima do orçamento planejado, se houver — confira em Planejamento.</li>
      </ul>
    </div>

    <div class="section-title">Principais contas do próximo mês (${monthLabel(nextMk)})</div>
    ${nextEvents.length ? `<div class="table-scroll"><table class="datatable"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th style="text-align:right">Valor</th></tr></thead><tbody>
      ${nextEvents.map(e=>`<tr><td class="mono">${fmtDate(e.date)}</td><td>${escapeHtml(e.desc)}</td><td><span class="badge ${e.badge}">${e.tag}</span></td><td class="num">${fmtBRL(e.valor)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Nenhuma pendência prevista para o próximo mês ainda.</div>`}
  `;
  const btn = document.getElementById('fechar-mes');
  if(btn) btn.addEventListener('click', ()=>{
    mutate(()=>{
      mesData.fechado = true;
      const next = ensureMonth(nextMk);
      if(next.saldoInicial==null) next.saldoInicial = m.saldoDisponivel;
    });
    toast('Mês fechado — saldo transferido para o próximo mês'); render();
  });
}

}
function applyCorrecaoParcelasNubankAgosto2026(){
  if(!state.importsAplicados) state.importsAplicados = [];
  const flag = 'correcao-parcelas-nubank-2026-08-v2';
  if(state.importsAplicados.includes(flag)) return false;
  const cartaoNu = state.cartoes.find(c=> (c.banco||'').toLowerCase().includes('nubank') || (c.nome||'').toLowerCase().includes('nubank'));
  if(!cartaoNu){ state.importsAplicados.push(flag); return false; }
  let changed = false;
  (cartaoNu.compras||[]).forEach(c=>{
    if(c.descricao === 'Azul Linhas'){ c.valorTotal=4091.40; c.parcelas=6; c.mesInicio='2026-08'; c.dataCompra='2026-08-11'; changed=true; }
    if(c.descricao === 'Seguro Médico'){ c.valorTotal=1369.30; c.parcelas=10; c.mesInicio='2026-08'; c.dataCompra='2026-08-11'; changed=true; }
    if(c.descricao === 'Mercado*Mlclubborrac'){ c.valorTotal=385.68; c.parcelas=6; c.mesInicio='2026-06'; c.dataCompra='2026-06-11'; changed=true; }
    if(c.descricao === 'Renegociação de pendências'){ c.valorTotal=16963.02; c.parcelas=9; c.mesInicio='2026-03'; c.dataCompra='2026-03-11'; changed=true; }
  });
  state.importsAplicados.push(flag);
  return changed;
}
function applyAjustarReceitasSetDez(){
  if(!state.importsAplicados) state.importsAplicados = [];
  const flag = 'ajustar-receitas-set-dez-2026';
  if(state.importsAplicados.includes(flag)) return false;
  const itauConta = state.contas.find(c=>c.banco==='Itaú');
  const itauId = itauConta ? itauConta.id : (state.contas[0] && state.contas[0].id);
  const plano = { '2026-09':[3900,3000], '2026-10':[9540,2000], '2026-11':[9540,2000], '2026-12':[9540,2000] };
  Object.entries(plano).forEach(([mk, vals])=>{
    const [salario, plantao] = vals;
    const mes = ensureMonth(mk);
    mes.receitas = mes.receitas.filter(r=> r.descricao!=='Salário' && r.descricao!=='Plantão');
    if(!mes.receitas.some(r=>r.descricao==='Fernando')){
      mes.receitas.push({id:uid(), descricao:'Fernando', categoria:'Consultoria', valor:1500, dataPrevista:mk+'-05', dataRecebimento:null, conta:itauId, status:'previsto', recorrente:true});
    }
    mes.receitas.push({id:uid(), descricao:'Salário', categoria:'Salário', valor:salario, dataPrevista:mk+'-05', dataRecebimento:null, conta:itauId, status:'previsto', recorrente:true});
    mes.receitas.push({id:uid(), descricao:'Plantão', categoria:'Plantão', valor:plantao, dataPrevista:mk+'-25', dataRecebimento:null, conta:itauId, status:'previsto', recorrente:false});
  });
  state.importsAplicados.push(flag);
  return true;
}
function applyCriarMeta20mil(){
  if(!state.importsAplicados) state.importsAplicados = [];
  const flag = 'criar-meta-20mil-dezembro-2026';
  if(state.importsAplicados.includes(flag)) return false;
  if(!state.metas.some(m=>m.nome==='Meta R$20.000 até dezembro')){
    state.metas.push({ id: uid(), nome: 'Meta R$20.000 até dezembro', valorObjetivo: 20000, valorAcumulado: 0, prazo: '2026-12-31' });
  }
  state.importsAplicados.push(flag);
  return true;
}
async function init(){
  const saved = await loadState();
  let backupAplicadoAgora = false;
  if(saved && saved.importsAplicados && saved.importsAplicados.includes(BACKUP_IMPORT_FLAG)){
    state = saved;
    if(!state.categorias) state.categorias = JSON.parse(JSON.stringify(DEFAULT_CATS));
    if(!state.cartoes) state.cartoes = [];
    if(!state.investimentosCarteira) state.investimentosCarteira = [];
    const movido = applyMoverDespesasOutubroParaAgosto();
    const appleCorrigido = applyCorrecaoCategoriaApple();
    const serieGerada = applyGerarSerieAssinaturasAgosto();
    const valeGerado = applyCriarValeAlimentacao();
    const faturaNuCorrigida = applyCorrecaoFaturaNubankAgosto();
    const parcelasNuCorrigidas = applyCorrecaoParcelasNubankAgosto2026();
    const cicloCorrigido = applyCorrecaoCicloFechamento();
    const duplicidadeRemovida = applyRemoverDuplicidadeAssinaturasDespesa();
    const receitasAjustadas = applyAjustarReceitasSetDez();
    const metaCriada = applyCriarMeta20mil();
    if(movido || appleCorrigido || serieGerada || valeGerado || faturaNuCorrigida || parcelasNuCorrigidas || cicloCorrigido || duplicidadeRemovida || receitasAjustadas || metaCriada) await saveState();
  } else {
    state = buildImportedBaseline();
    applyCriarValeAlimentacao();
    backupAplicadoAgora = true;
    await saveState();
  }
  const theme = state.theme || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn();

  const monthsAvailable = Object.keys(state.meses).sort();
  CURRENT_MONTH = backupAplicadoAgora ? '2026-08' : (monthsAvailable.length ? monthsAvailable[monthsAvailable.length-1] : monthKey(2026,7));
  ensureMonth(CURRENT_MONTH);

  render();
  if(backupAplicadoAgora) toast('Dados atualizados com o backup do Chrome');
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* offline/local file: sem suporte, segue normal */ });
  });
}
